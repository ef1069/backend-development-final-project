<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Event App</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header>
    <h1>Event Management</h1>
    <div>
      <span id="username"></span> 
      <button id="logoutBtn" style="display:none">Logout</button>
    </div>
  </header>

  <section id="auth">
    <h2 id="loginHeader">Login</h2>
    <form id="loginForm">
      <input id="email" type="email" placeholder="Email" required />
      <input id="password" type="password" placeholder="Password" required />
      <button type="submit">Login</button>
    </form>
  </section>

  <section>
    <h2>Events</h2>
    <button id="fetchEvents">Load Events</button>
    <div id="events"></div>
  </section>

  <section>
    <h2>Create Event</h2>
    <form id="createEventForm" method="POST">
      <input id="eventName" type="name" placeholder="Event Name" required/>
      <input id="eventDescription" type="paragraph" placeholder="Event Description" required/>
      <input id="eventDate" type="date" placeholder="Event Date" required/>
      <input id="eventLocation" type="text" placeholder="Event Location" required/>
      <button type="submit">Create</button>
    </form>
  </section>

  <section>
    <form>
      <h2>Delete Event</h2>
        <input id="deleteEventId" type="text" placeholder="Event ID" required/>
        <button id="deleteEventBtn" type="submit">Delete</button>
    </form>
  </section>
</body>
</html>
